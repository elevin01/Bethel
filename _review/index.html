<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Bethel PR layout review</title><style>body{font:14px system-ui;margin:20px;background:#e4e7e1;color:#182019}label,button,select{font:inherit;margin:0 8px 10px 0}button{padding:8px}iframe{display:block;width:390px;height:844px;border:0;background:#fff}pre{white-space:pre-wrap;max-width:1250px}#stage{width:max-content}</style></head><body><h1>Bethel PR layout review</h1><p>Temporary preview checks. Removed before final handoff.</p><label>Page <select id="page"><option value="/">Home</option><option value="/visit/">Visit</option><option value="/about/">About</option><option value="/youth/">Youth</option><option value="/schedule/">Schedule</option><option value="/ministry/">Resources</option><option value="/prayer/">Prayer</option><option value="/events/">Events</option><option value="/serve/">Serve</option><option value="/worship/">Worship</option><option value="/online/">Online</option><option value="/bible-study/">Bible study</option></select></label><label>Width <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1440</option></select></label><button id="show">Show layout</button><button id="run">Run checks</button><p id="status">Ready</p><pre id="results"></pre><div id="stage"><iframe id="site" title="Site under review" src="../"></iframe></div><script>
const frame=document.querySelector('#site'), page=document.querySelector('#page'), width=document.querySelector('#width'), status=document.querySelector('#status'), results=document.querySelector('#results');
const paths=[...page.options].map(x=>x.value), widths=[320,390,768,1440];
async function load(path,w){frame.style.width=w+'px';frame.style.height=(w>720?950:844)+'px';await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Load timeout '+path)),20000);frame.onload=()=>{clearTimeout(timer);resolve()};frame.src=path+'?review=8';});await frame.contentDocument.fonts.ready;await Promise.all([...frame.contentDocument.images].map(im=>{im.loading='eager';return im.decode().catch(()=>{})}));await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));}
document.querySelector('#show').onclick=()=>load(page.value,+width.value);
document.querySelector('#run').onclick=async()=>{const report={layouts:[],accessibility:[],interactions:[],errors:[]};results.textContent='';document.querySelector('#run').disabled=true;try{for(const path of paths){for(const w of widths){status.textContent='Checking '+path+' at '+w;await load(path,w);const d=frame.contentDocument,win=frame.contentWindow;report.layouts.push({path,width:w,overflow:d.documentElement.scrollWidth>w,failedImages:[...d.images].filter(x=>!x.complete||!x.naturalWidth).map(x=>x.src),h1:d.querySelectorAll('h1').length});if(path==='/'&&w===390){const t=d.querySelector('.nav__toggle'),m=d.querySelector('#mobileMenu');t.click();report.interactions.push({name:'Mobile menu opens',pass:t.getAttribute('aria-expanded')==='true'&&!m.hidden});d.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));report.interactions.push({name:'Escape closes menu and returns focus',pass:m.hidden&&d.activeElement===t});const details=d.querySelectorAll('details')[1];details.querySelector('summary').click();report.interactions.push({name:'FAQ expands',pass:details.open});}if(w===390){await new Promise((resolve,reject)=>{const s=d.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.14.0/axe.min.js';s.onload=resolve;s.onerror=reject;d.head.append(s)});const ax=await win.axe.run(d,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa']}});report.accessibility.push({path,violations:ax.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))}))});}}}const ppt=await fetch('/assets/ppt/genesis.pptx');const bytes=new Uint8Array(await ppt.arrayBuffer());report.interactions.push({name:'Real presentation download',pass:ppt.ok&&bytes[0]===80&&bytes[1]===75});}catch(e){report.errors.push(e.message)}status.textContent='Complete';results.textContent=JSON.stringify(report,null,2);document.querySelector('#run').disabled=false;await load(page.value,+width.value);};
</script></body></html>
